openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsroom
    description: Public newsroom content
  - name: newsletter
    description: Newsletter subscriptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /newsroom/content:
    get:
      operationId: getNewsroomContent
      tags: [newsroom]
      summary: Get the current newsroom content snapshot
      description: Returns the maintained editorial content used by the public publication.
      responses:
        "200":
          description: Current newsroom content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomContent"
        "503":
          description: Content source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/metadata:
    get:
      operationId: getNewsroomMetadata
      tags: [newsroom]
      summary: Get metadata for published newsroom routes
      description: Returns the build-safe title and description manifest generated from the same maintained source as newsroom content.
      responses:
        "200":
          description: Current newsroom metadata manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomMetadata"
        "503":
          description: Metadata source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsletter/subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to the Daily Brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "200":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Subscription could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    NewsletterSubscriptionInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
      required:
        - email
    NewsletterSubscription:
      type: object
      properties:
        status:
          type: string
          enum: [subscribed, queued]
        provider:
          type: string
        message:
          type: string
      required:
        - status
        - provider
        - message
    NewsroomContent:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
        stale:
          type: boolean
        authors:
          type: array
          items:
            type: object
            additionalProperties: true
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        evidenceSummaries:
          type: object
          additionalProperties: true
        entities:
          type: array
          items:
            type: object
            additionalProperties: true
        timelineEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        stories:
          type: array
          items:
            type: object
            additionalProperties: true
        signals:
          type: array
          items:
            type: object
            additionalProperties: true
        industryMap:
          type: array
          items:
            type: object
            additionalProperties: true
        indiaIndex:
          type: array
          items:
            type: object
            additionalProperties: true
        essays:
          type: array
          items:
            type: object
            additionalProperties: true
        askGlobalAnswers:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - generatedAt
        - source
        - stale
        - authors
        - sources
        - evidenceSummaries
        - entities
        - timelineEvents
        - stories
        - signals
        - industryMap
        - indiaIndex
        - essays
        - askGlobalAnswers
    NewsroomMetadata:
      type: object
      properties:
        source:
          type: string
          enum: [maintained-editorial-source]
        generatedAt:
          type: string
          format: date-time
        routes:
          type: array
          items:
            $ref: "#/components/schemas/SeoMetadata"
      required:
        - source
        - generatedAt
        - routes
    SeoMetadata:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        path:
          type: string
        article:
          type: boolean
        ampPath:
          type: string
        imagePath:
          type: string
        imageAlt:
          type: string
      required:
        - title
        - description
        - path

