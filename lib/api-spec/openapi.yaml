openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsroom
    description: Public newsroom content
  - name: newsletter
    description: Newsletter subscriptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /newsroom/content:
    get:
      operationId: getNewsroomContent
      tags: [newsroom]
      summary: Get the current newsroom content snapshot
      description: Returns the maintained editorial content used by the public publication.
      responses:
        "200":
          description: Current newsroom content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomContent"
        "503":
          description: Content source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/metadata:
    get:
      operationId: getNewsroomMetadata
      tags: [newsroom]
      summary: Get metadata for published newsroom routes
      description: Returns the build-safe title and description manifest generated from the same maintained source as newsroom content.
      responses:
        "200":
          description: Current newsroom metadata manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomMetadata"
        "503":
          description: Metadata source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/profile-reviews:
    get:
      operationId: getNewsroomProfileReviews
      tags: [newsroom]
      summary: Get profiles due or nearing their editorial review date
      security:
        - clerkSession: []
      responses:
        "200":
          description: Profiles due for editorial review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileReviewQueue"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Profile review queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/profile-reviews/{slug}:
    patch:
      operationId: updateNewsroomProfileReview
      tags: [newsroom]
      summary: Record an explicit editorial review date for a profile
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileReviewUpdate"
      responses:
        "200":
          description: Profile review date saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileReviewDate"
        "400":
          description: Invalid review date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Profile review date could not be saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/automation/runs:
    get:
      operationId: getNewsroomAutomationRuns
      tags: [newsroom]
      summary: Get recent autonomous editorial run audits
      description: Returns sanitized editor-facing outcomes for recent autonomous drafting and verification runs.
      security:
        - clerkSession: []
      parameters:
        - name: outcome
          in: query
          description: Return only runs with this outcome.
          required: false
          schema:
            $ref: "#/components/schemas/EditorialAutomationRunOutcome"
        - name: cadence
          in: query
          description: Return only runs with this publishing cadence.
          required: false
          schema:
            $ref: "#/components/schemas/EditorialCadence"
      responses:
        "200":
          description: Recent autonomous editorial run audits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialAutomationRunQueue"
        "400":
          description: Invalid automation run filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Automation audit unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/automation/status:
    get:
      operationId: getNewsroomAutomationStatus
      tags: [newsroom]
      summary: Get editorial automation status
      description: Returns editor-facing automation configuration and the latest run.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Editorial automation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialAutomationStatus"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Automation status unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/automation/run:
    post:
      operationId: runNewsroomAutomation
      tags: [newsroom]
      summary: Run editorial automation manually
      description: Starts a manual editorial automation run.
      security:
        - clerkSession: []
      responses:
        "202":
          description: Editorial automation run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialAutomationRunAccepted"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Automation run failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases:
    get:
      operationId: getNewsroomReleases
      tags: [newsroom]
      summary: Get the editor-managed release queue
      description: Returns scheduled, published, and canceled prepared articles in editorial order.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Editorial release queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReleaseQueue"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Release queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNewsroomRelease
      tags: [newsroom]
      summary: Add a prepared article to the release queue
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReleaseInput"
      responses:
        "201":
          description: Release created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialRelease"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Release slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases/history:
    get:
      operationId: getNewsroomReleaseHistory
      tags: [newsroom]
      summary: Get recent release change history
      description: Returns the latest durable audit entries for editor-managed release changes.
      security:
        - clerkSession: []
      parameters:
        - name: releaseSlug
          in: query
          required: false
          description: Return history for one release slug. Use queue for queue-level changes.
          schema:
            type: string
        - name: action
          in: query
          required: false
          description: Return history for one change type.
          schema:
            $ref: "#/components/schemas/EditorialReleaseHistoryAction"
        - name: actor
          in: query
          required: false
          description: Return history for one editor identity.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Recent release history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReleaseHistory"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Release history unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases/reorder:
    post:
      operationId: reorderNewsroomReleases
      tags: [newsroom]
      summary: Reorder active prepared articles
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReleaseReorderInput"
      responses:
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Reordered release queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReleaseQueue"
        "400":
          description: Invalid release order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases/{slug}:
    patch:
      operationId: updateNewsroomRelease
      tags: [newsroom]
      summary: Edit or reschedule a prepared article
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReleaseUpdate"
      responses:
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Release updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialRelease"
        "400":
          description: Invalid release update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelNewsroomRelease
      tags: [newsroom]
      summary: Cancel a prepared article
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Canceled release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialRelease"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsletter/subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to the Daily Brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "200":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Subscription could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie for an authenticated editor.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ProfileReviewUpdate:
      type: object
      additionalProperties: false
      properties:
        reviewedAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      required: [reviewedAt]
    ProfileReviewDate:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        reviewedAt:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      required: [slug, reviewedAt]
    ProfileReviewReference:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
        url:
          type: string
          format: uri
      required: [label, url]
    ProfileReviewTimelineEvent:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        title:
          type: string
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        url:
          type: string
        references:
          type: array
          items:
            $ref: "#/components/schemas/ProfileReviewReference"
      required: [slug, title, date, url, references]
    ProfileReviewQueueItem:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [company, lab, model, person, technology, institution, policy, dataset, infrastructure]
        url:
          type: string
        reviewedAt:
          type: ["string", "null"]
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        dueAt:
          type: ["string", "null"]
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        daysUntilDue:
          type: ["integer", "null"]
        reason:
          type: string
          enum: [linked-update, interval, invalid-date, upcoming]
        primaryReferences:
          type: array
          items:
            $ref: "#/components/schemas/ProfileReviewReference"
        newerTimelineEvents:
          type: array
          items:
            $ref: "#/components/schemas/ProfileReviewTimelineEvent"
      required: [slug, name, kind, url, reviewedAt, dueAt, daysUntilDue, reason, primaryReferences, newerTimelineEvents]
    ProfileReviewQueue:
      type: object
      additionalProperties: false
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileReviewQueueItem"
      required: [profiles]
    NewsletterSubscriptionInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
        website:
          type: string
          maxLength: 500
          description: Honeypot field for automated signup spam detection.
      required:
        - email
    NewsletterSubscription:
      type: object
      properties:
        status:
          type: string
          enum: [subscribed, queued]
        provider:
          type: string
        message:
          type: string
      required:
        - status
        - provider
        - message
    PublicNewsroomAuthor:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          type: string
        bio:
          type: string
        location:
          type: string
        initials:
          type: string
      required: [slug, name, role, bio, location, initials]
    PublicNewsroomSource:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        name:
          type: string
        title:
          type: string
        publisher:
          type: string
        kind:
          type: string
          enum: [primary, independent, dataset, filing, interview]
        sourceType:
          type: string
          enum:
            - government-record
            - government-portal
            - parliamentary-record
            - news-report
            - industry-report
            - research-report
            - academic-paper
            - dataset
            - filing
            - interview
            - technical-document
            - other
        classification:
          type: string
          enum: [primary, secondary]
        url:
          type: string
          format: uri
        accessed:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        publicationDate:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        tier:
          type: integer
          enum: [1, 2, 3]
        evidenceType:
          type: string
          enum: [full-page, portal-capture, snippet-only]
        scopeNote:
          type: string
        relevance:
          type: string
        notes:
          type: array
          items:
            type: string
      required: [slug, name, publisher, kind, url, accessed]
    PublicNewsroomEvidenceSummary:
      type: object
      additionalProperties: false
      properties:
        primarySources:
          type: integer
        independentConfirmations:
          type: integer
        confidence:
          type: string
          enum: [HIGH, MEDIUM, DEVELOPING]
        note:
          type: string
      required: [primarySources, independentConfirmations, confidence, note]
    PublicNewsroomBodySection:
      type: object
      additionalProperties: false
      properties:
        heading:
          type: string
        paragraphs:
          type: array
          items:
            type: string
        pullQuote:
          type: string
        table:
          $ref: "#/components/schemas/PublicNewsroomTable"
      required: [heading, paragraphs]
    PublicNewsroomTable:
      type: object
      additionalProperties: false
      properties:
        caption:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PublicNewsroomTableRow"
      required: [headers, rows]
    PublicNewsroomTableRow:
      type: object
      additionalProperties: false
      properties:
        cells:
          type: array
          items:
            type: string
      required: [cells]
    PublicNewsroomImageTreatment:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [editorial-abstract, field-photograph, data-graphic, portrait]
        alt:
          type: string
        palette:
          type: string
        caption:
          type: string
      required: [type, alt, palette, caption]
    PublicNewsroomTimelineEvent:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        title:
          type: string
        description:
          type: string
        entities:
          type: array
          items:
            type: string
        story:
          type: string
        sourceSlugs:
          type: array
          items:
            type: string
        topicSlugs:
          type: array
          items:
            type: string
        researchSlugs:
          type: array
          items:
            type: string
        reportSlugs:
          type: array
          items:
            type: string
        dataProductSlugs:
          type: array
          items:
            type: string
      required: [slug, date, title, description, entities]
    PublicNewsroomEntity:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [company, lab, model, person, technology, institution, policy, dataset, infrastructure]
        strapline:
          type: string
        overview:
          type: string
        profileSections:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              heading:
                type: string
              paragraphs:
                type: array
                items:
                  type: string
            required: [heading, paragraphs]
        primaryReferences:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              label:
                type: string
              url:
                type: string
                format: uri
            required: [label, url]
        profileReviewedAt:
          type: string
          format: date
          description: Editorial date when this profile's primary references and key claims were checked.
        profileStatus:
          type: string
          enum: [maintained, historical]
          description: Whether this is a maintained organizational record or an explicitly historical model snapshot.
        profileReviewHistory:
          type: array
          description: Editorial review records for the profile, distinct from the current freshness status.
          items:
            type: object
            additionalProperties: false
            properties:
              reviewedAt:
                type: string
                format: date
              triggeringUpdate:
                type: string
              referencesChecked:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    label:
                      type: string
                    url:
                      type: string
                      format: uri
                    captureStatus:
                      type: string
                      enum: [snapshot, fingerprinted, not-captured, failed]
                    capturedAt:
                      type: string
                      format: date-time
                    contentHash:
                      type: string
                      pattern: '^[a-f0-9]{64}$'
                      description: Lowercase SHA-256 fingerprint of the captured source body.
                    snapshotUrl:
                      type: string
                      format: uri
                    captureNote:
                      type: string
                  required: [label, url, captureStatus]
              claimChangeSummary:
                type: string
            required: [reviewedAt, triggeringUpdate, referencesChecked, claimChangeSummary]
        headquarters:
          type: string
        founded:
          type: string
        relatedOrganizations:
          type: array
          items:
            type: string
        keyMetrics:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              label:
                type: string
              value:
                type: string
              context:
                type: string
            required: [label, value, context]
        latestDevelopments:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            type: string
        signals:
          type: array
          items:
            type: string
        recentStories:
          type: array
          items:
            type: string
      required:
        - slug
        - name
        - kind
        - strapline
        - overview
        - relatedOrganizations
        - keyMetrics
        - latestDevelopments
        - timeline
        - signals
        - recentStories
    PublicNewsroomStory:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        category:
          type: string
          enum: [Breakthroughs, Signals, India Watch, The Edge, Field Notes, Infrastructure, Policy]
        title:
          type: string
        dek:
          type: string
        body:
          type: array
          items:
            $ref: "#/components/schemas/PublicNewsroomBodySection"
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        dateModified:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        readTime:
          type: string
        author:
          type: string
        authorType:
          type: string
          enum: [person, organization]
        authorName:
          type: string
        evidence:
          type: string
        evidenceSummary:
          $ref: "#/components/schemas/PublicNewsroomEvidenceSummary"
        classification:
          type: string
          enum: [reported, analysis, opinion, synthesis]
        contentType:
          type: string
          enum: [Brief, Analysis, Explainer, Research, Report, Comparison, Essay]
        entities:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            type: string
        relatedStories:
          type: array
          items:
            type: string
        imageTreatment:
          $ref: "#/components/schemas/PublicNewsroomImageTreatment"
        topic:
          type: string
        sources:
          type: array
          items:
            type: string
        bottomLine:
          type: string
        whyItMatters:
          type: string
        keyTakeaways:
          type: array
          items:
            type: string
        whatChanges:
          type: string
      required:
        - slug
        - category
        - title
        - dek
        - body
        - date
        - readTime
        - author
        - evidence
        - evidenceSummary
        - classification
        - entities
        - timeline
        - relatedStories
        - imageTreatment
        - topic
        - sources
        - bottomLine
        - whyItMatters
        - keyTakeaways
        - whatChanges
    PublicNewsroomSignal:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        label:
          type: string
        topic:
          type: string
        direction:
          type: string
          enum: [up, down, steady]
        impact:
          type: string
          enum: [low, medium, high]
        change:
          type: string
        summary:
          type: string
        entities:
          type: array
          items:
            type: string
        stories:
          type: array
          items:
