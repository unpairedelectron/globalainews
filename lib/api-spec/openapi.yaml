openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: newsroom
    description: Public newsroom content
  - name: newsletter
    description: Newsletter subscriptions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /newsroom/content:
    get:
      operationId: getNewsroomContent
      tags: [newsroom]
      summary: Get the current newsroom content snapshot
      description: Returns the maintained editorial content used by the public publication.
      responses:
        "200":
          description: Current newsroom content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomContent"
        "503":
          description: Content source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/metadata:
    get:
      operationId: getNewsroomMetadata
      tags: [newsroom]
      summary: Get metadata for published newsroom routes
      description: Returns the build-safe title and description manifest generated from the same maintained source as newsroom content.
      responses:
        "200":
          description: Current newsroom metadata manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomMetadata"
        "503":
          description: Metadata source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases:
    get:
      operationId: getNewsroomReleases
      tags: [newsroom]
      summary: Get the editor-managed release queue
      description: Returns scheduled, published, and canceled prepared articles in editorial order.
      responses:
        "200":
          description: Editorial release queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReleaseQueue"
        "500":
          description: Release queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNewsroomRelease
      tags: [newsroom]
      summary: Add a prepared article to the release queue
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReleaseInput"
      responses:
        "201":
          description: Release created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialRelease"
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Invalid release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Release slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases/history:
    get:
      operationId: getNewsroomReleaseHistory
      tags: [newsroom]
      summary: Get recent release change history
      description: Returns the latest durable audit entries for editor-managed release changes.
      responses:
        "200":
          description: Recent release history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReleaseHistory"
        "500":
          description: Release history unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases/reorder:
    post:
      operationId: reorderNewsroomReleases
      tags: [newsroom]
      summary: Reorder active prepared articles
      security:
        - clerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReleaseReorderInput"
      responses:
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Reordered release queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialReleaseQueue"
        "400":
          description: Invalid release order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsroom/releases/{slug}:
    patch:
      operationId: updateNewsroomRelease
      tags: [newsroom]
      summary: Edit or reschedule a prepared article
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditorialReleaseUpdate"
      responses:
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Release updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialRelease"
        "400":
          description: Invalid release update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelNewsroomRelease
      tags: [newsroom]
      summary: Cancel a prepared article
      security:
        - clerkSession: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          description: Editor sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: Canceled release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditorialRelease"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /newsletter/subscriptions:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe an email address to the Daily Brief
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterSubscriptionInput"
      responses:
        "200":
          description: Subscription accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscription"
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Subscription could not be persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk browser session cookie for an authenticated editor.
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    NewsletterSubscriptionInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 320
      required:
        - email
    NewsletterSubscription:
      type: object
      properties:
        status:
          type: string
          enum: [subscribed, queued]
        provider:
          type: string
        message:
          type: string
      required:
        - status
        - provider
        - message
    NewsroomContent:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
        stale:
          type: boolean
        authors:
          type: array
          items:
            type: object
            additionalProperties: true
        sources:
          type: array
          items:
            type: object
            additionalProperties: true
        evidenceSummaries:
          type: object
          additionalProperties: true
        entities:
          type: array
          items:
            type: object
            additionalProperties: true
        timelineEvents:
          type: array
          items:
            type: object
            additionalProperties: true
        stories:
          type: array
          items:
            type: object
            additionalProperties: true
        signals:
          type: array
          items:
            type: object
            additionalProperties: true
        industryMap:
          type: array
          items:
            type: object
            additionalProperties: true
        indiaIndex:
          type: array
          items:
            type: object
            additionalProperties: true
        essays:
          type: array
          items:
            type: object
            additionalProperties: true
        askGlobalAnswers:
          type: array
          items:
            type: object
            additionalProperties: true
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/EditorialScheduleItem"
      required:
        - generatedAt
        - source
        - stale
        - authors
        - sources
        - evidenceSummaries
        - entities
        - timelineEvents
        - stories
        - signals
        - industryMap
        - indiaIndex
        - essays
        - askGlobalAnswers
        - schedule
    EditorialStory:
      type: object
      additionalProperties: true
    EditorialReleaseStatus:
      type: string
      enum: [scheduled, published, canceled]
    EditorialCadence:
      type: string
      enum: [daily, weekly]
    EditorialScheduleItem:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        dek:
          type: string
        publishAt:
          type: string
          format: date-time
        cadence:
          $ref: "#/components/schemas/EditorialCadence"
        status:
          $ref: "#/components/schemas/EditorialReleaseStatus"
        position:
          type: integer
        story:
          $ref: "#/components/schemas/EditorialStory"
      required: [slug, title, dek, publishAt, cadence, status, position]
    EditorialRelease:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        dek:
          type: string
        publishAt:
          type: string
          format: date-time
        cadence:
          $ref: "#/components/schemas/EditorialCadence"
        status:
          $ref: "#/components/schemas/EditorialReleaseStatus"
        position:
          type: integer
        story:
          $ref: "#/components/schemas/EditorialStory"
        updatedAt:
          type: string
          format: date-time
      required: [id, slug, title, dek, publishAt, cadence, status, position, story, updatedAt]
    EditorialReleaseInput:
      type: object
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 120
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        title:
          type: string
          minLength: 1
          maxLength: 240
        dek:
          type: string
          minLength: 1
          maxLength: 500
        publishAt:
          type: string
          format: date-time
        cadence:
          $ref: "#/components/schemas/EditorialCadence"
        category:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
      required: [slug, title, dek, publishAt, cadence, category, author, body]
    EditorialReleaseUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        dek:
          type: string
          minLength: 1
          maxLength: 500
        publishAt:
          type: string
          format: date-time
        cadence:
          $ref: "#/components/schemas/EditorialCadence"
        category:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        body:
          type: string
          minLength: 1
      minProperties: 1
    EditorialReleaseReorderInput:
      type: object
      properties:
        slugs:
          type: array
          minItems: 1
          items:
            type: string
      required: [slugs]
    EditorialReleaseQueue:
      type: array
      items:
        $ref: "#/components/schemas/EditorialRelease"
    EditorialReleaseHistoryAction:
      type: string
      enum: [created, edited, rescheduled, reordered, canceled]
    EditorialReleaseHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        releaseId:
          type: integer
          nullable: true
        releaseSlug:
          type: string
        releaseTitle:
          type: string
        actor:
          type: string
        action:
          $ref: "#/components/schemas/EditorialReleaseHistoryAction"
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, releaseSlug, releaseTitle, actor, action, summary, createdAt]
    EditorialReleaseHistory:
      type: array
      items:
        $ref: "#/components/schemas/EditorialReleaseHistoryEntry"
    NewsroomMetadata:
      type: object
      properties:
        source:
          type: string
          enum: [maintained-editorial-source]
        generatedAt:
          type: string
          format: date-time
        routes:
          type: array
          items:
            $ref: "#/components/schemas/SeoMetadata"
      required:
        - source
        - generatedAt
        - routes
    SeoMetadata:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        path:
          type: string
        article:
          type: boolean
        ampPath:
          type: string
        imagePath:
          type: string
        imageAlt:
          type: string
      required:
        - title
        - description
        - path
