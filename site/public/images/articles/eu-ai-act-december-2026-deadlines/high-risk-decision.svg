<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">High-risk AI Act dates depend on classification route</title>
  <desc id="desc">A decision diagram separates Article 6 paragraph 2 and Annex III use cases, applying from 2 December 2027, from qualifying Article 6 paragraph 1 and Annex I product systems, applying from 2 August 2028.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.question{font-size:22px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:18px;fill:#526574}.arrow{stroke:#7e9cab;stroke-width:5;fill:none}</style>
  <rect width="1200" height="680" fill="#f6f4ee"/>
  <text class="title" x="48" y="58">High-risk dates depend on classification</text>
  <rect x="345" y="105" width="510" height="100" rx="20" fill="#e4eef2" stroke="#8eaebb" stroke-width="2"/>
  <text class="question" x="430" y="148">Which Article 6 route applies?</text><text class="body" x="435" y="180">Use statutory tests, not sector shorthand.</text>
  <path class="arrow" d="M600 205v45H300v35M600 250h300v35"/>
  <rect x="55" y="285" width="500" height="260" rx="22" fill="#e0eee8" stroke="#8eb9a7" stroke-width="2"/>
  <text class="head" x="85" y="330">Article 6(2) · Annex III</text>
  <text class="body" x="85" y="378">Listed high-risk use cases</text>
  <text class="body" x="85" y="414">Chapter III Sections 1–3</text>
  <text class="head" x="85" y="485">2 December 2027</text>
  <rect x="645" y="285" width="500" height="260" rx="22" fill="#ece8f3" stroke="#a99ac5" stroke-width="2"/>
  <text class="head" x="675" y="330">Article 6(1) · Annex I</text>
  <text class="body" x="675" y="378">Qualifying regulated products</text>
  <text class="body" x="675" y="414">Specified conformity assessment</text>
  <text class="head" x="675" y="485">2 August 2028</text>
  <text class="body" x="55" y="600">A product label alone does not determine the route. Article 6 and Annex conditions control.</text>
  <text class="body" x="55" y="632">Source: amended Article 113, Article 6, Annexes I and III.</text>
</svg>
