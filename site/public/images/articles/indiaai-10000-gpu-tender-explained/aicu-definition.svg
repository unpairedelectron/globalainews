<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">What the 10,000 AI compute units mean</title>
  <desc id="desc">The C-DAC RFE defines an AI compute unit as a hardware device and lists GPUs, accelerators, TPUs and similar components. The initial request is up to 10,000 units in clusters, with demand-based scaling possible above that level.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.big{font-size:43px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:20px;fill:#526574}.card{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.blue{fill:#e5edf3;stroke:#477da8;stroke-width:2}.green{fill:#e5efe9;stroke:#287b63;stroke-width:2}.sand{fill:#f3e9dd;stroke:#a87947;stroke-width:2}
  </style>
  <text class="title" x="38" y="48">AICU is broader than “one GPU”</text>
  <rect class="card blue" x="32" y="78" width="836" height="125" rx="16"/>
  <text class="head" x="62" y="122">Initial requested scope</text>
  <text class="big" x="62" y="177">Up to 10,000 AICU</text>
  <rect class="card green" x="32" y="224" width="400" height="132" rx="16"/>
  <text class="head" x="58" y="266">Unit definition</text>
  <text class="body" x="58" y="305"><tspan x="58">Hardware device: GPU, accelerator,</tspan><tspan x="58" dy="27">TPU or similar component.</tspan></text>
  <rect class="card sand" x="468" y="224" width="400" height="132" rx="16"/>
  <text class="head" x="494" y="266">Cluster structures</text>
  <text class="body" x="494" y="305"><tspan x="494">4,000 · 1,000 · 512 units,</tspan><tspan x="494" dy="27">or a size specified at Stage 2.</tspan></text>
  <text class="body" x="38" y="405">Demand-based expansion beyond 10,000 is permitted—not guaranteed.</text>
  <text class="body" x="38" y="447">The RFE does not establish purchases, deployment or utilization.</text>
</svg>
