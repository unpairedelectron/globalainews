<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Access and containment are different controls</title>
  <desc id="desc">Carbon has a staged external access plan; Fairwind's published security terms are for Gemini 4 Argon; OpenAI's offline training account concerns a training environment, not user access.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.head{font-size:26px;font-weight:700}.body{font-size:23px;fill:#526574}.card{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.a{stroke:#287b63}.b{stroke:#477da8}.c{stroke:#a87947}
  </style>
  <text class="title" x="38" y="48">Three controls, three different questions</text>
  <rect class="card a" x="30" y="78" width="265" height="345" rx="16"/>
  <text class="head" x="55" y="121">Carbon</text>
  <text class="body" x="55" y="164"><tspan x="55">Staged external</tspan><tspan x="55" dy="31">model access:</tspan><tspan x="55" dy="31">defenders, then</tspan><tspan x="55" dy="31">trusted partners,</tspan><tspan x="55" dy="31">then product users.</tspan><tspan x="55" dy="40">No public date.</tspan></text>
  <rect class="card b" x="318" y="78" width="265" height="345" rx="16"/>
  <text class="head" x="343" y="121">Fairwind / Argon</text>
  <text class="body" x="343" y="164"><tspan x="343">Program page lists</tspan><tspan x="343" dy="31">due diligence and</tspan><tspan x="343" dy="31">phishing-resistant</tspan><tspan x="343" dy="31">MFA for Argon.</tspan><tspan x="343" dy="40">Do not assume</tspan><tspan x="343" dy="31">same Carbon terms.</tspan></text>
  <rect class="card c" x="606" y="78" width="265" height="345" rx="16"/>
  <text class="head" x="631" y="121">OpenAI</text>
  <text class="body" x="631" y="164"><tspan x="631">Offline training</tspan><tspan x="631" dy="31">environment is a</tspan><tspan x="631" dy="31">containment control,</tspan><tspan x="631" dy="31">not a public model</tspan><tspan x="631" dy="31">access program.</tspan></text>
  <text class="body" x="38" y="456">Sources: Google and OpenAI statements; scopes remain distinct.</text>
</svg>
