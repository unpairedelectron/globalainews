<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Detected AI involvement in merged pull requests by language</title>
  <desc id="desc">GitHub reported detected AI involvement in 44.1 percent of TypeScript merged pull requests, 41.1 percent of Python, 40.4 percent of Rust and 21.2 percent of Java over the preceding 12 months.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:29px;font-weight:700}.label{font-size:27px}.muted{font-size:23px;fill:#526574}.grid{stroke:#cbd5dc;stroke-width:2}.b1{fill:#287b63}.b2{fill:#477da8}.b3{fill:#7c6d9a}.b4{fill:#bb8051}
  </style>
  <text class="title" x="44" y="48">Merged pull requests with detected AI involvement</text>
  <text class="muted" x="44" y="79">Share within each language · preceding 12 months</text>
  <line class="grid" x1="245" y1="115" x2="245" y2="405"/>
  <line class="grid" x1="465" y1="115" x2="465" y2="405"/><text class="muted" x="450" y="430">25%</text>
  <line class="grid" x1="685" y1="115" x2="685" y2="405"/><text class="muted" x="668" y="430">50%</text>
  <text class="label" x="44" y="157">TypeScript</text><rect class="b1" x="245" y="124" width="388" height="44" rx="7"/><text class="label" x="648" y="157">44.1%</text>
  <text class="label" x="44" y="222">Python</text><rect class="b2" x="245" y="189" width="361" height="44" rx="7"/><text class="label" x="620" y="222">41.1%</text>
  <text class="label" x="44" y="287">Rust</text><rect class="b3" x="245" y="254" width="355" height="44" rx="7"/><text class="label" x="615" y="287">40.4%</text>
  <text class="label" x="44" y="352">Java</text><rect class="b4" x="245" y="319" width="186" height="44" rx="7"/><text class="label" x="446" y="352">21.2%</text>
  <text class="muted" x="44" y="478">GitHub Octoverse 2026 · merged PRs, preceding 12 months</text>
</svg>
