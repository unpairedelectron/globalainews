<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Controls across an agent access flow</title><desc id="desc">A five-step flow from task definition through identity, permission, confirmation and audit or revocation.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:17px;fill:#526574}.line{stroke:#9bb1bc;stroke-width:4}</style>
<rect width="1200" height="650" fill="#f6f4ee"/><text class="title" x="48" y="58">A sign-in is only one part of the task</text>
<line class="line" x1="122" y1="180" x2="1080" y2="180"/>
<g><circle cx="130" cy="180" r="32" fill="#347c9b"/><text x="122" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#fff">1</text><text class="head" x="70" y="245">Task</text><text class="body" x="70" y="277">Clear and</text><text class="body" x="70" y="303">limited</text></g>
<g><circle cx="365" cy="180" r="32" fill="#b27b42"/><text x="357" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#fff">2</text><text class="head" x="300" y="245">Identity</text><text class="body" x="300" y="277">Person, agent</text><text class="body" x="300" y="303">or brokered</text></g>
<g><circle cx="600" cy="180" r="32" fill="#337e6b"/><text x="592" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#fff">3</text><text class="head" x="535" y="245">Permission</text><text class="body" x="535" y="277">Minimum scope</text><text class="body" x="535" y="303">for the task</text></g>
<g><circle cx="835" cy="180" r="32" fill="#786aa4"/><text x="827" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#fff">4</text><text class="head" x="775" y="245">Confirm</text><text class="body" x="775" y="277">Action and</text><text class="body" x="775" y="303">destination clear</text></g>
<g><circle cx="1070" cy="180" r="32" fill="#c2695e"/><text x="1062" y="187" font-family="Arial" font-size="20" font-weight="700" fill="#fff">5</text><text class="head" x="1000" y="245">Review</text><text class="body" x="1000" y="277">Audit and</text><text class="body" x="1000" y="303">revoke access</text></g>
<rect x="55" y="385" width="1090" height="126" rx="20" fill="#e4eef2"/><text class="head" x="88" y="430">Security depends on the entire sequence</text><text class="body" x="88" y="468">A hidden password does not by itself narrow permissions, validate actions or ensure recovery.</text>
<text class="body" x="55" y="570">Source context: NIST, Google OAuth guidance, OWASP and vendor announcements.</text>
</svg>
