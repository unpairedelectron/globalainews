<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Selected Anthropic S-1 financial figures</title>
  <desc id="desc">The S-1 reports 4.6 billion dollars in FY2025 revenue, 16.3 billion dollars in first-half 2026 revenue, 693 million dollars in first-half operating loss, and 80.7 billion dollars in first-half net loss including a 72.4 billion dollar fair-value change.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.value{font-size:28px;font-weight:700}.note{font-size:21px;fill:#526574}.card{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.rev{stroke:#477da8}.loss{stroke:#a87947}
  </style>
  <text class="title" x="38" y="48">Four figures, distinct periods and measures</text>
  <rect class="card rev" x="32" y="78" width="400" height="150" rx="15"/>
  <text class="label" x="60" y="118">FY2025 revenue</text><text class="value" x="60" y="163">$4.6 billion</text>
  <text class="note" x="60" y="199">Full fiscal year</text>
  <rect class="card rev" x="468" y="78" width="400" height="150" rx="15"/>
  <text class="label" x="496" y="118">H1 2026 revenue</text><text class="value" x="496" y="163">$16.3 billion</text>
  <text class="note" x="496" y="199">Six months ended 30 June</text>
  <rect class="card loss" x="32" y="252" width="400" height="150" rx="15"/>
  <text class="label" x="60" y="292">H1 2026 operating loss</text><text class="value" x="60" y="337">$693 million</text>
  <text class="note" x="60" y="373">Operating measure</text>
  <rect class="card loss" x="468" y="252" width="400" height="150" rx="15"/>
  <text class="label" x="496" y="292">H1 2026 net loss</text><text class="value" x="496" y="337">$80.7 billion</text>
  <text class="note" x="496" y="373">Includes $72.4B fair-value change</text>
  <text class="note" x="38" y="450">Fair-value movement is not the same as cash operating expense.</text>
  <text class="note" x="38" y="487">Top five: ~25% of revenue, nine months to 30 Sep 2026.</text>
  <text class="note" x="38" y="524">Issuer figures from S-1; rounded for readability.</text>
</svg>
