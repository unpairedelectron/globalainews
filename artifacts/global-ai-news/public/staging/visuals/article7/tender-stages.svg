<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">C-DAC AI compute procurement stages</title>
  <desc id="desc">Stage 1 qualifies and empanels providers. Stage 2 procures services through GeM. Written engagement comes before provisioning and end-user access. Empanelment alone does not guarantee work.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.head{font-size:23px;font-weight:700}.body{font-size:19px;fill:#526574}.card{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.stage1{stroke:#477da8}.stage2{stroke:#287b63}.later{stroke:#a87947}.line{stroke:#8da2b2;stroke-width:4}
  </style>
  <text class="title" x="38" y="48">From empanelment to service delivery</text>
  <line class="line" x1="96" y1="112" x2="806" y2="112"/>
  <circle cx="110" cy="112" r="13" fill="#477da8"/><circle cx="330" cy="112" r="13" fill="#287b63"/><circle cx="535" cy="112" r="13" fill="#a87947"/><circle cx="760" cy="112" r="13" fill="#a87947"/>
  <rect class="card stage1" x="32" y="150" width="190" height="215" rx="14"/>
  <text class="head" x="52" y="190"><tspan x="52">Stage 1</tspan><tspan x="52" dy="31">Technical</tspan><tspan x="52" dy="31">qualification</tspan></text>
  <text class="body" x="52" y="296"><tspan x="52">Provider</tspan><tspan x="52" dy="26">empanelment</tspan></text>
  <rect class="card stage2" x="246" y="150" width="190" height="215" rx="14"/>
  <text class="head" x="266" y="190"><tspan x="266">Stage 2</tspan><tspan x="266" dy="31">GeM service</tspan><tspan x="266" dy="31">procurement</tspan></text>
  <text class="body" x="266" y="296"><tspan x="266">Quantities and</tspan><tspan x="266" dy="26">award strategy</tspan></text>
  <rect class="card later" x="460" y="150" width="190" height="215" rx="14"/>
  <text class="head" x="480" y="190"><tspan x="480">Written</tspan><tspan x="480" dy="31">engagement</tspan></text>
  <text class="body" x="480" y="270"><tspan x="480">Agreement and</tspan><tspan x="480" dy="26">performance</tspan><tspan x="480" dy="26">security</tspan></text>
  <rect class="card later" x="674" y="150" width="194" height="215" rx="14"/>
  <text class="head" x="694" y="190"><tspan x="694">Provision and</tspan><tspan x="694" dy="31">user access</tspan></text>
  <text class="body" x="694" y="270"><tspan x="694">Capacity, service</tspan><tspan x="694" dy="26">availability and</tspan><tspan x="694" dy="26">usage are later</tspan><tspan x="694" dy="26">milestones.</tspan></text>
  <text class="body" x="38" y="430">Stage-1 empanelment does not guarantee work allocation.</text>
  <text class="body" x="38" y="465">C-DAC RFE C-DAC/GPU/01/2026 · 27 Oct dates apply.</text>
</svg>
