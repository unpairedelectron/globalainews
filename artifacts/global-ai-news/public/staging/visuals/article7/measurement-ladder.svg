<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">From tender request to actual AI compute usage</title>
  <desc id="desc">A five-step ladder distinguishes requested capacity, qualified providers, awarded services, provisioned capacity and end-user usage. The C-DAC RFE confirms the requested requirement, while later official records are needed to establish the remaining steps.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px;fill:#526574}.card{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.known{stroke:#287b63}.later{stroke:#a87947}
  </style>
  <text class="title" x="38" y="48">A number needs a milestone label</text>
  <rect class="card known" x="32" y="76" width="836" height="70" rx="13"/>
  <text class="head" x="58" y="107">1 · Requested capacity</text><text class="body" x="395" y="107">RFE states up to 10,000 AICU</text>
  <rect class="card later" x="32" y="158" width="836" height="70" rx="13"/>
  <text class="head" x="58" y="189">2 · Qualified providers</text><text class="body" x="395" y="189">Stage-1 results needed</text>
  <rect class="card later" x="32" y="240" width="836" height="70" rx="13"/>
  <text class="head" x="58" y="271">3 · Awarded services</text><text class="body" x="395" y="271">Stage-2 GeM notices needed</text>
  <rect class="card later" x="32" y="322" width="836" height="70" rx="13"/>
  <text class="head" x="58" y="353">4 · Provisioned capacity</text><text class="body" x="395" y="353">Deployment evidence needed</text>
  <rect class="card later" x="32" y="404" width="836" height="70" rx="13"/>
  <text class="head" x="58" y="435">5 · End-user usage</text><text class="body" x="395" y="435">Allocation and usage data needed</text>
  <text class="body" x="38" y="505">Do not report step 1 as step 4 or step 5.</text>
</svg>
