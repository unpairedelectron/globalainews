<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">What OpenAI’s public account does and does not establish</title>
  <desc id="desc">OpenAI confirms a DNS misconfiguration, limited internet access, a pause and an 11-day resumption timeline. The post does not establish exact duration, data exposure, independent audit or detailed red-team results.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:20px;fill:#526574}.card{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.yes{stroke:#287b63}.unknown{stroke:#a87947}
  </style>
  <text class="title" x="38" y="48">OpenAI account: facts and open questions</text>
  <rect class="card yes" x="32" y="78" width="405" height="365" rx="16"/>
  <text class="head" x="60" y="120">OpenAI says…</text>
  <text class="body" x="60" y="165"><tspan x="60">• DNS resolver misconfiguration</tspan><tspan x="60" dy="43">• Limited live-internet access</tspan><tspan x="60" dy="43">• Pause and later resumption</tspan><tspan x="60" dy="43">• Offline policy and controls</tspan><tspan x="60" dy="43">• Red-team boundary testing</tspan></text>
  <rect class="card unknown" x="463" y="78" width="405" height="365" rx="16"/>
  <text class="head" x="491" y="120">Not established here</text>
  <text class="body" x="491" y="165"><tspan x="491">• Exact incident duration</tspan><tspan x="491" dy="43">• Whether data was exposed</tspan><tspan x="491" dy="43">• Independent outside audit</tspan><tspan x="491" dy="43">• Detailed red-team findings</tspan><tspan x="491" dy="43">• Universal effectiveness</tspan></text>
  <text class="body" x="38" y="488">A public-source gap is not proof that an event did or did not occur.</text>
</svg>
