<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Compare agent access by control, not by label</title><desc id="desc">Checklist of identity, scope, secret handling, approval, audit, revocation and data flow for evaluating agent access products.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:17px;fill:#526574}</style>
<rect width="1200" height="700" fill="#f6f4ee"/><text class="title" x="48" y="58">A practical comparison checklist</text>
<rect x="55" y="110" width="1090" height="490" rx="20" fill="#fff" stroke="#b8cbd3" stroke-width="2"/>
<g><rect x="75" y="135" width="1050" height="56" rx="10" fill="#e4eef2"/><text class="head" x="98" y="170">Identity</text><text class="body" x="350" y="170">Which account or session does the service see?</text></g>
<g><rect x="75" y="205" width="1050" height="56" rx="10" fill="#f7f5f0"/><text class="head" x="98" y="240">Scope</text><text class="body" x="350" y="240">Can access be narrowed to a task or resource?</text></g>
<g><rect x="75" y="275" width="1050" height="56" rx="10" fill="#e4eef2"/><text class="head" x="98" y="310">Secret handling</text><text class="body" x="350" y="310">Are passwords and tokens kept out of prompts and logs?</text></g>
<g><rect x="75" y="345" width="1050" height="56" rx="10" fill="#f7f5f0"/><text class="head" x="98" y="380">Approval</text><text class="body" x="350" y="380">Can the person see destination, action and scope?</text></g>
<g><rect x="75" y="415" width="1050" height="56" rx="10" fill="#e4eef2"/><text class="head" x="98" y="450">Audit</text><text class="body" x="350" y="450">Can actions be attributed and reviewed?</text></g>
<g><rect x="75" y="485" width="1050" height="56" rx="10" fill="#f7f5f0"/><text class="head" x="98" y="520">Revocation</text><text class="body" x="350" y="520">Can an owner stop access and remove grants?</text></g>
<text class="body" x="55" y="642">If controls are undocumented, treat them as unknown and limit access.</text>
</svg>
