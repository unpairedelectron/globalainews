<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Three ways an agent can receive account access</title><desc id="desc">Comparison of shared passwords, separate agent identities and brokered access, with benefits and outstanding security questions.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:17px;fill:#526574}.tag{font-size:16px;font-weight:700}</style>
<rect width="1200" height="700" fill="#f6f4ee"/><text class="title" x="48" y="58">Three patterns for delegated access</text><text class="body" x="48" y="92">Each changes a different boundary; none removes every risk.</text>
<g><rect x="50" y="135" width="350" height="420" rx="20" fill="#f2e9dc" stroke="#c7a679" stroke-width="2"/><text class="tag" x="78" y="178">PATTERN 1</text><text class="head" x="78" y="220">Shared credential</text><text class="body" x="78" y="270">Agent receives a reusable</text><text class="body" x="78" y="298">password or session.</text><text class="body" x="78" y="362">Questions:</text><text class="body" x="78" y="395">Can it be copied, retained</text><text class="body" x="78" y="423">or reused? Which actor</text><text class="body" x="78" y="451">appears in the audit trail?</text></g>
<g><rect x="425" y="135" width="350" height="420" rx="20" fill="#e0eee8" stroke="#8eb9a7" stroke-width="2"/><text class="tag" x="453" y="178">PATTERN 2</text><text class="head" x="453" y="220">Separate identity</text><text class="body" x="453" y="270">Agent gets its own account</text><text class="body" x="453" y="298">and defined permissions.</text><text class="body" x="453" y="362">Questions:</text><text class="body" x="453" y="395">Are scopes narrow? Who</text><text class="body" x="453" y="423">owns the account and</text><text class="body" x="453" y="451">revokes it when needed?</text></g>
<g><rect x="800" y="135" width="350" height="420" rx="20" fill="#e4eef2" stroke="#8eaebb" stroke-width="2"/><text class="tag" x="828" y="178">PATTERN 3</text><text class="head" x="828" y="220">Credential broker</text><text class="body" x="828" y="270">A service mediates sign-in</text><text class="body" x="828" y="298">without revealing a password.</text><text class="body" x="828" y="362">Questions:</text><text class="body" x="828" y="395">What can it authorize?</text><text class="body" x="828" y="423">What does the person</text><text class="body" x="828" y="451">approve and what is logged?</text></g>
<text class="body" x="55" y="615">Compare actual scopes, audit trails, approval and revocation—not product labels.</text>
</svg>
