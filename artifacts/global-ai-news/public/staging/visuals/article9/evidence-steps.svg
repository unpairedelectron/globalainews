<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Five checks for responsible reporting on workforce announcements</title><desc id="desc">A checklist covering speaker, event type, the number's meaning, time horizon, and whether the primary source names AI as the cause.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.num{font-size:19px;font-weight:700}.body{font-size:18px;fill:#526574}</style>
<rect width="1200" height="700" fill="#f6f4ee"/><text class="title" x="48" y="60">Five checks before repeating a workforce number</text>
<g><circle cx="100" cy="150" r="28" fill="#347c9b"/><text x="93" y="157" font-family="Arial" font-size="20" font-weight="700" fill="#fff">1</text><text class="num" x="150" y="145">Who is speaking?</text><text class="body" x="150" y="174">Employer, government, union or unnamed source?</text></g>
<g><circle cx="100" cy="245" r="28" fill="#b27b42"/><text x="93" y="252" font-family="Arial" font-size="20" font-weight="700" fill="#fff">2</text><text class="num" x="150" y="240">What event is described?</text><text class="body" x="150" y="269">Offer, target, notice or completed exit?</text></g>
<g><circle cx="100" cy="340" r="28" fill="#337e6b"/><text x="93" y="347" font-family="Arial" font-size="20" font-weight="700" fill="#fff">3</text><text class="num" x="150" y="335">What does the number count?</text><text class="body" x="150" y="364">Eligible people, FTEs, departures or net headcount?</text></g>
<g><circle cx="100" cy="435" r="28" fill="#786aa4"/><text x="93" y="442" font-family="Arial" font-size="20" font-weight="700" fill="#fff">4</text><text class="num" x="150" y="430">What is the time horizon?</text><text class="body" x="150" y="459">Immediate action or multi-year plan?</text></g>
<g><circle cx="100" cy="530" r="28" fill="#c2695e"/><text x="93" y="537" font-family="Arial" font-size="20" font-weight="700" fill="#fff">5</text><text class="num" x="150" y="525">Does the source say AI caused it?</text><text class="body" x="150" y="554">If not, do not add causation from context alone.</text></g>
<text class="body" x="55" y="640">A primary-source date or number still needs its scope and limitations.</text>
</svg>
