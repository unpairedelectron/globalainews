<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Two workforce announcements describe different events</title><desc id="desc">Comparison of a voluntary Microsoft exit offer and a Dutch government multi-year FTE target, showing what each primary source establishes and leaves unknown.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.sub{font-size:20px;fill:#526574}.head{font-size:22px;font-weight:700}.body{font-size:18px;fill:#526574}.tag{font-size:16px;font-weight:700}</style>
<rect width="1200" height="700" fill="#f6f4ee"/><text class="title" x="48" y="58">Two announcements, different workforce events</text><text class="sub" x="48" y="94">Read the primary source before adopting the headline’s cause.</text>
<rect x="55" y="140" width="515" height="390" rx="22" fill="#e4eef2" stroke="#8eaebb" stroke-width="2"/><text class="tag" x="85" y="184">MICROSOFT · 26 OCTOBER</text><text class="head" x="85" y="226">Voluntary exit offer</text><text class="body" x="85" y="276">Eligible employees in</text><text class="body" x="85" y="307">participating organizations</text><text class="body" x="85" y="362">Primary source does not report</text><text class="body" x="85" y="393">acceptances or net headcount.</text><rect x="85" y="440" width="440" height="54" rx="12" fill="#fff"/><text class="body" x="106" y="475">No stated AI-caused total</text>
<rect x="630" y="140" width="515" height="390" rx="22" fill="#f2e9dc" stroke="#c7a679" stroke-width="2"/><text class="tag" x="660" y="184">DUTCH GOVERNMENT · 26 OCTOBER</text><text class="head" x="660" y="226">Multi-year staffing target</text><text class="body" x="660" y="276">Estimated 25,000 FTE over</text><text class="body" x="660" y="307">several years; tied to savings</text><text class="body" x="660" y="362">AI productivity plans are</text><text class="body" x="660" y="393">separately due in Q1 2027.</text><rect x="660" y="440" width="440" height="54" rx="12" fill="#fff"/><text class="body" x="681" y="475">No stated AI-caused total</text>
<text class="body" x="55" y="590">Eligibility ≠ departures. FTE target ≠ completed layoffs. Co-occurrence ≠ causation.</text><text class="body" x="55" y="625">Sources: Microsoft and Government of the Netherlands.</text>
</svg>
