<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Evidence required rises with each workforce claim</title><desc id="desc">Five steps distinguish a voluntary offer, stated target, individual departures, net headcount change, and a documented causal claim about AI.</desc>
<style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:32px;font-weight:700}.step{font-size:20px;font-weight:700}.body{font-size:17px;fill:#526574}.inverse{fill:#fff}</style>
<rect width="1200" height="720" fill="#f6f4ee"/><text class="title" x="48" y="58">A claim ladder for workforce stories</text>
<rect x="55" y="120" width="1030" height="86" rx="16" fill="#e4eef2" stroke="#8eaebb" stroke-width="2"/><text class="step" x="82" y="157">1 · Offer or plan</text><text class="body" x="360" y="157">Primary announcement, eligibility or scope</text><text class="body" x="360" y="184">Example: a voluntary program or future target</text>
<rect x="95" y="226" width="990" height="86" rx="16" fill="#e0eee8" stroke="#8eb9a7" stroke-width="2"/><text class="step" x="122" y="263">2 · Departures</text><text class="body" x="360" y="263">Acceptance and completed-separation records</text><text class="body" x="360" y="290">Eligibility does not measure uptake</text>
<rect x="135" y="332" width="950" height="86" rx="16" fill="#f2e9dc" stroke="#c7a679" stroke-width="2"/><text class="step" x="162" y="369">3 · Net workforce change</text><text class="body" x="500" y="369">Comparable totals including hires and attrition</text><text class="body" x="500" y="396">Targets do not establish completed outcomes</text>
<rect x="175" y="438" width="910" height="86" rx="16" fill="#ece8f3" stroke="#a99ac5" stroke-width="2"/><text class="step" x="202" y="475">4 · AI causation</text><text class="body" x="500" y="475">Explicit attribution or credible causal analysis</text><text class="body" x="500" y="502">AI investment nearby is not proof</text>
<rect x="55" y="585" width="1030" height="66" rx="14" fill="#18374b"/><text class="inverse" x="82" y="627" font-family="Arial,sans-serif" font-size="21" font-weight="700">Report only the highest step the evidence supports.</text>
</svg>
