<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">The AI Act has multiple application dates</title>
  <desc id="desc">A timeline from July 2026 to August 2028. Separate rows identify the Article 5 and Article 50(2) changes, Annex III high-risk systems, and relevant Annex I product systems.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#18374b}.title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#526574}.date{font-size:20px;font-weight:700}.label{font-size:20px;font-weight:700}.body{font-size:17px;fill:#526574}.line{stroke:#a9bdc8;stroke-width:4}.node{stroke:#fff;stroke-width:5}</style>
  <rect width="1200" height="720" fill="#f6f4ee"/>
  <text class="title" x="48" y="60">The AI Act has multiple application dates</text>
  <text class="sub" x="48" y="96">Amended Article 113 keeps each date attached to a provision and system class.</text>
  <line class="line" x1="105" y1="165" x2="1090" y2="165"/>
  <circle class="node" cx="130" cy="165" r="16" fill="#347c9b"/><circle class="node" cx="420" cy="165" r="16" fill="#b27b42"/><circle class="node" cx="745" cy="165" r="16" fill="#337e6b"/><circle class="node" cx="1050" cy="165" r="16" fill="#786aa4"/>
  <text class="date" x="86" y="205">27 Jul 2026</text><text class="date" x="365" y="205">2 Dec 2026</text><text class="date" x="690" y="205">2 Dec 2027</text><text class="date" x="995" y="205">2 Aug 2028</text>
  <rect x="55" y="245" width="500" height="110" rx="18" fill="#e4eef2" stroke="#8eaebb" stroke-width="2"/>
  <text class="label" x="80" y="282">Amending regulation in force</text><text class="body" x="80" y="316">Regulation 2026/1744 entered into force.</text>
  <rect x="590" y="245" width="555" height="110" rx="18" fill="#f2e9dc" stroke="#c7a679" stroke-width="2"/>
  <text class="label" x="615" y="282">Two separate December changes</text><text class="body" x="615" y="316">Specified Article 5 provisions + Article 50(2) transition.</text>
  <rect x="55" y="400" width="500" height="110" rx="18" fill="#e0eee8" stroke="#8eb9a7" stroke-width="2"/>
  <text class="label" x="80" y="437">Annex III high-risk route</text><text class="body" x="80" y="471">Article 6(2): Chapter III Sections 1–3 apply.</text>
  <rect x="590" y="400" width="555" height="110" rx="18" fill="#ece8f3" stroke="#a99ac5" stroke-width="2"/>
  <text class="label" x="615" y="437">Annex I product route</text><text class="body" x="615" y="471">Relevant Article 6(1): Chapter III Sections 1–3 apply.</text>
  <text class="body" x="55" y="570">Dates are not substitutes for classification; the Official Journal text controls.</text>
  <text class="body" x="55" y="605">Sources: Regulation 2026/1744, amended Article 113, European Commission.</text>
</svg>
