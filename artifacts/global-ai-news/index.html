    <script data-clarity-bootstrap>
      (() => {
        const projectId = 'x8gfztdtd7';
        const privateRoutes = ['/insights', '/sign-in', '/sign-up', '/account', '/editor', '/admin', '/api', '/glucosmart-privacy'];
        const eligible = (url) => {
          const pathname = url.pathname.replace(/\/+$/, '') || '/';
          return !url.search && !url.hash && !privateRoutes.some((route) => pathname === route || pathname.startsWith(`${route}/`));
        };

        if (!eligible(window.location)) return;
        if (document.referrer) {
          try {
            if (!eligible(new URL(document.referrer))) return;
          } catch {
            return;
          }
        }
        if (window.__globalAiClarityStarted || document.querySelector(`script[data-clarity-project="${projectId}"]`)) return;

        window.__globalAiClarityStarted = true;
        const clarity = (...args) => (clarity.q ??= []).push(args);
        clarity.q = [];
        window.clarity = clarity;
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.clarity.ms/tag/${projectId}`;
        script.dataset.clarityProject = projectId;
        script.onerror = () => {};
        document.head.appendChild(script);
      })();
    </script>
