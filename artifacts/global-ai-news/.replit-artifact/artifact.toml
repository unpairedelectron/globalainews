kind = "web"
previewPath = "/"
title = "Global AI News"
description = "A premium global AI and technology news platform with editorial storytelling, SEO-ready article experiences, responsive ad placements, newsletter growth, and an analytics-focused publishing workspace."
version = "1.0.0"
id = "artifacts/global-ai-news"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19819

[services.development]
run = "pnpm --filter @workspace/global-ai-news run dev"

[services.production]
[services.production.build]
args = [ "pnpm", "--filter", "@workspace/global-ai-news", "run", "build:production" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/global-ai-news/dist/server/server.mjs" ]

[services.production.run.env]
PORT = "19819"
NODE_ENV = "production"
NEWSROOM_API_ORIGIN = "https://www.globalainews.in"

[services.production.health.startup]
path = "/healthz"

[[services.production.rewrites]]
from = "/sign-in/*"
to = "/sign-in/index.html"

[[services.production.rewrites]]
from = "/sign-up/*"
to = "/sign-up/index.html"


[services.env]
PORT = "19819"
BASE_PATH = "/"
NEWSROOM_API_ORIGIN = "http://localhost:80"

[[services.production.responseHeaders]]
path = "/sitemap.xml"
name = "Content-Type"
value = "application/xml; charset=utf-8"

[[services.production.responseHeaders]]
path = "/social/articles/*"
name = "Cache-Control"
value = "public, max-age=86400, must-revalidate"
