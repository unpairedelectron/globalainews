kind = "web"
previewPath = "/"
title = "Global AI News"
description = "A premium global AI and technology news platform with editorial storytelling, SEO-ready article experiences, responsive ad placements, newsletter growth, and an analytics-focused publishing workspace."
version = "1.0.0"
id = "artifacts/global-ai-news"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19819

[services.development]
run = "cd ../../site && npm install --no-audit --no-fund && npx astro dev --host 0.0.0.0 --port 19819"

[services.production]
[services.production.build]
args = [ "bash", "-c", "cd site && npm ci --no-audit --no-fund && npm run build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "node", "site/server.mjs" ]

[services.production.run.env]
PORT = "19819"
NODE_ENV = "production"
NEWSROOM_API_ORIGIN = "https://www.globalainews.in"

[services.production.health.startup]
path = "/healthz"




[services.env]
PORT = "19819"
BASE_PATH = "/"
NEWSROOM_API_ORIGIN = "http://localhost:80"

[[services.production.responseHeaders]]
path = "/sitemap.xml"
name = "Content-Type"
value = "application/xml; charset=utf-8"

