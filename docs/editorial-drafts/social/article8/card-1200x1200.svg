<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">EU AI Act dates are not one deadline</title><desc id="desc">Separate dates for Article 50 and high-risk systems.</desc>
<rect width="1200" height="1200" fill="#f6f4ee"/><rect width="18" height="1200" fill="#347c9b"/>
<text x="72" y="100" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#347c9b">GLOBAL AI NEWS  /  POLICY &amp; COMPLIANCE</text>
<text x="72" y="255" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#18374b">EU AI Act</text>
<text x="72" y="330" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#18374b">dates are not</text>
<text x="72" y="405" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#18374b">one deadline</text>
<text x="72" y="478" font-family="Arial,sans-serif" font-size="25" fill="#526574">The obligation and system category</text><text x="72" y="514" font-family="Arial,sans-serif" font-size="25" fill="#526574">determine which date matters.</text>
<rect x="72" y="590" width="1056" height="350" rx="24" fill="#e4eef2"/>
<text x="110" y="660" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18374b">2 December 2026</text><text x="110" y="700" font-family="Arial,sans-serif" font-size="21" fill="#526574">Specified Article 5 provisions and the Article 50(2) transition</text>
<text x="110" y="790" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18374b">2 December 2027</text><text x="110" y="830" font-family="Arial,sans-serif" font-size="21" fill="#526574">Article 6(2) / Annex III high-risk systems</text>
<text x="110" y="900" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18374b">2 August 2028</text><text x="110" y="940" font-family="Arial,sans-serif" font-size="21" fill="#526574">Relevant Article 6(1) / Annex I systems</text>
<text x="72" y="1080" font-family="Arial,sans-serif" font-size="20" fill="#526574">Dated guide to amended Article 113 · Private draft</text>
</svg>
