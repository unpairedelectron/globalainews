<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">EU AI Act dates are not one deadline</title><desc id="desc">Separate dates for Article 50 and high-risk systems.</desc>
<rect width="1200" height="630" fill="#f6f4ee"/><rect width="18" height="630" fill="#347c9b"/>
<text x="72" y="74" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#347c9b">GLOBAL AI NEWS  /  POLICY &amp; COMPLIANCE</text>
<text x="72" y="175" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#18374b">EU AI Act dates</text>
<text x="72" y="238" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#18374b">are not one deadline</text>
<text x="72" y="310" font-family="Arial,sans-serif" font-size="24" fill="#526574">Dec 2026, 2027 and 2028 depend on the obligation</text>
<text x="72" y="345" font-family="Arial,sans-serif" font-size="24" fill="#526574">and system category.</text>
<rect x="72" y="410" width="1056" height="112" rx="18" fill="#e4eef2"/>
<text x="104" y="458" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18374b">2 Dec 2026</text><text x="104" y="492" font-family="Arial,sans-serif" font-size="19" fill="#526574">Article 5 additions / Article 50(2) transition</text>
<text x="660" y="458" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#18374b">2027 / 2028</text><text x="660" y="492" font-family="Arial,sans-serif" font-size="19" fill="#526574">Separate high-risk routes</text>
<text x="72" y="585" font-family="Arial,sans-serif" font-size="18" fill="#526574">A dated guide to amended Article 113 · Private draft</text>
</svg>
