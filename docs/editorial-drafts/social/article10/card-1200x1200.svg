<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">AI agents need access, not your password</title><desc id="desc">Credential brokers, separate identities and local AI address different security boundaries.</desc>
<rect width="1200" height="1200" fill="#f6f4ee"/><rect width="18" height="1200" fill="#347c9b"/>
<text x="72" y="100" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#347c9b">GLOBAL AI NEWS  /  AGENTS &amp; SECURITY</text>
<text x="72" y="250" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#18374b">AI agents need</text>
<text x="72" y="325" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#18374b">access—not your</text>
<text x="72" y="400" font-family="Arial,sans-serif" font-size="60" font-weight="700" fill="#18374b">password</text>
<text x="72" y="475" font-family="Arial,sans-serif" font-size="24" fill="#526574">Different designs solve different boundaries.</text>
<rect x="72" y="550" width="1056" height="385" rx="24" fill="#e4eef2"/>
<text x="112" y="630" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18374b">Credential broker</text><text x="112" y="672" font-family="Arial,sans-serif" font-size="21" fill="#526574">Mediates sign-in</text>
<text x="112" y="755" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18374b">Separate identity</text><text x="112" y="797" font-family="Arial,sans-serif" font-size="21" fill="#526574">Makes the acting account visible</text>
<text x="112" y="880" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18374b">Local inference</text><text x="112" y="922" font-family="Arial,sans-serif" font-size="21" fill="#526574">Changes model location, not all permissions</text>
<text x="72" y="1080" font-family="Arial,sans-serif" font-size="20" fill="#526574">Review identity, scope, audit and revocation</text>
</svg>
