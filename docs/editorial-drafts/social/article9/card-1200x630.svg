<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Workforce announcements do not prove AI caused the cuts</title><desc id="desc">Microsoft announced a voluntary exit offer; the Dutch government set a separate multi-year staffing target.</desc>
<rect width="1200" height="630" fill="#f6f4ee"/><rect width="18" height="630" fill="#347c9b"/>
<text x="72" y="74" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#347c9b">GLOBAL AI NEWS  /  WORK &amp; SOCIETY</text>
<text x="72" y="172" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#18374b">Workforce plans</text>
<text x="72" y="231" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#18374b">don’t prove AI caused cuts</text>
<text x="72" y="304" font-family="Arial,sans-serif" font-size="23" fill="#526574">A voluntary offer is not a layoff count.</text>
<text x="72" y="340" font-family="Arial,sans-serif" font-size="23" fill="#526574">A multi-year target is not a completed outcome.</text>
<rect x="72" y="405" width="1056" height="112" rx="18" fill="#e4eef2"/>
<text x="104" y="453" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18374b">Microsoft</text><text x="104" y="486" font-family="Arial,sans-serif" font-size="18" fill="#526574">Voluntary exit offer</text>
<text x="660" y="453" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#18374b">Netherlands</text><text x="660" y="486" font-family="Arial,sans-serif" font-size="18" fill="#526574">Estimated 25,000 FTE over years</text>
<text x="72" y="582" font-family="Arial,sans-serif" font-size="18" fill="#526574">Separate the speaker, event, time horizon and stated cause · Private draft</text>
</svg>
