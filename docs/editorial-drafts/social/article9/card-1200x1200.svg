<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">Workforce announcements do not prove AI caused the cuts</title><desc id="desc">Microsoft announced a voluntary exit offer; the Dutch government set a separate multi-year staffing target.</desc>
<rect width="1200" height="1200" fill="#f6f4ee"/><rect width="18" height="1200" fill="#347c9b"/>
<text x="72" y="100" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#347c9b">GLOBAL AI NEWS  /  WORK &amp; SOCIETY</text>
<text x="72" y="248" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#18374b">Workforce plans</text>
<text x="72" y="320" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#18374b">don’t prove AI</text>
<text x="72" y="392" font-family="Arial,sans-serif" font-size="58" font-weight="700" fill="#18374b">caused the cuts</text>
<text x="72" y="462" font-family="Arial,sans-serif" font-size="24" fill="#526574">Offers, targets and actual departures are different events.</text>
<rect x="72" y="540" width="1056" height="390" rx="24" fill="#e4eef2"/>
<text x="112" y="625" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18374b">Microsoft</text><text x="112" y="670" font-family="Arial,sans-serif" font-size="21" fill="#526574">Voluntary exit offer; uptake not yet known</text>
<text x="112" y="780" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#18374b">Netherlands</text><text x="112" y="825" font-family="Arial,sans-serif" font-size="21" fill="#526574">Estimated 25,000 FTE over several years</text>
<text x="112" y="900" font-family="Arial,sans-serif" font-size="20" fill="#526574">Official statements do not attribute a specific total to AI.</text>
<text x="72" y="1080" font-family="Arial,sans-serif" font-size="20" fill="#526574">Source-linked reporting</text>
</svg>
