<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI’s described offline training boundary</title>
  <desc id="desc">Inside the logical sandbox are an offline search index, cached web material and a message board for allowed teammates. OpenAI says direct connections to live internet and its infrastructure, plus unauthorized communication between isolated agents, are blocked.</desc>
  <style>
    text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:22px;fill:#526574}.small{font-size:18px;fill:#526574}.inside{fill:#e5efe9;stroke:#287b63;stroke-width:3}.outside{fill:#f3e9dd;stroke:#a87947;stroke-width:2}.resource{fill:#fffdf7;stroke:#b8c7d1;stroke-width:2}.line{stroke:#a45c53;stroke-width:4;stroke-dasharray:10 8}
  </style>
  <text class="title" x="38" y="48">Offline means bounded access—not no resources</text>
  <rect class="inside" x="40" y="82" width="560" height="350" rx="20"/>
  <text class="head" x="72" y="126">Training sandbox</text>
  <rect class="resource" x="75" y="158" width="235" height="90" rx="12"/>
  <text class="body" x="96" y="195"><tspan x="96">Offline search</tspan><tspan x="96" dy="28">index</tspan></text>
  <rect class="resource" x="330" y="158" width="235" height="90" rx="12"/>
  <text class="body" x="350" y="195"><tspan x="350">Cached web</tspan><tspan x="350" dy="28">material</tspan></text>
  <rect class="resource" x="75" y="270" width="490" height="98" rx="12"/>
  <text class="small" x="100" y="304"><tspan x="100">Shared message board</tspan><tspan x="100" dy="25">for allowed teammates</tspan><tspan x="100" dy="25">Unauthorized cross-agent messaging blocked</tspan></text>
  <rect class="outside" x="640" y="104" width="220" height="112" rx="15"/>
  <text class="head" x="665" y="147">Live internet</text>
  <text class="body" x="665" y="183">Blocked path</text>
  <rect class="outside" x="640" y="265" width="220" height="112" rx="15"/>
  <text class="head" x="665" y="308">OpenAI systems</text>
  <text class="body" x="665" y="344">Blocked path</text>
  <path class="line" d="M600 160h34m-12-12 12 12-12 12M600 320h34m-12-12 12 12-12 12"/>
  <text class="body" x="40" y="478">OpenAI’s published diagram; not an independent audit.</text>
</svg>
